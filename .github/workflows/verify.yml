name: Verify static site

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify puzzles and static files
        shell: pwsh
        run: ./verify.ps1
      - name: Check JavaScript syntax
        shell: bash
        run: for file in *.js; do node --check "$file"; done
